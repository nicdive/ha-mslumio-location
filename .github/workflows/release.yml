name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches the tag
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(python3 -c "import json; print(json.load(open('custom_components/usvegliu/manifest.json'))['version'])")"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match manifest version $version"
            exit 1
          fi
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="$(awk '/^## \[/{if(found){exit} found=1; next} found' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" \
            --title "Usvegliu ${GITHUB_REF_NAME#v}" \
            --notes "${notes:-Usvegliu ${GITHUB_REF_NAME#v}}" \
            --verify-tag
