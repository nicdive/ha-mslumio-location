regenerer_voucher:
  name: Régénérer le voucher
  description: >
    Supprime le voucher UniFi du séjour et en crée un nouveau.
    Administrateurs et utilisateurs avec droits. Pas les locataires.
    Le code complet n'est pas écrit dans le journal HA.
  fields:
    reservation_key:
      name: Réservation
      description: Clé de réservation. Vide = séjour affiché par le capteur.
      example: airbnb-uid|2026-07-01
      selector:
        text:

revoquer_voucher:
  name: Révoquer le voucher
  description: >
    Supprime le code Wi-Fi du séjour. Il n'est pas recréé tant que vous
    n'appelez pas Régénérer le voucher.
  fields:
    reservation_key:
      name: Réservation
      description: Vide = séjour affiché par le capteur.
      selector:
        text:

regenerer_nuki:
  name: Régénérer le code porte
  description: >
    Supprime le code Keypad Nuki du séjour et en crée un nouveau.
    Administrateurs et utilisateurs avec droits. Pas les locataires.
    Le PIN n'est pas écrit dans le journal HA.
  fields:
    reservation_key:
      name: Réservation
      description: Vide = séjour affiché par le capteur.
      selector:
        text:

revoquer_nuki:
  name: Révoquer le code porte
  description: >
    Supprime le code Keypad du séjour. Il n'est pas recréé tant que vous
    n'appelez pas Régénérer le code porte.
  fields:
    reservation_key:
      name: Réservation
      description: Vide = séjour affiché par le capteur.
      selector:
        text:

regenerer_acces:
  name: Régénérer l'accès Home Assistant
  description: >
    Change le mot de passe du locataire. Le nouveau mot de passe apparaît
    sur la console propriétaire.
  fields:
    reservation_key:
      name: Réservation
      description: Clé de réservation. Vide = séjour affiché par le capteur.
      selector:
        text:

revoquer_acces:
  name: Révoquer l'accès Home Assistant
  description: >
    Supprime le compte locataire. Il n'est pas recréé tant que vous
    n'appelez pas Régénérer l'accès.
  fields:
    reservation_key:
      name: Réservation
      description: Vide = séjour affiché par le capteur.
      selector:
        text:

renvoyer_notification:
  name: Renvoyer la notification
  description: >
    Renvoie la notification propriétaire, et le mail d'accueil au locataire
    s'il a une adresse (admins et utilisateurs avec droits).
  fields:
    reservation_key:
      name: Réservation
      selector:
        text:

imprimer_voucher:
  name: Imprimer le voucher
  description: >
    Émet l'événement usvegliu_print_voucher avec le code en clair, pour une
    automatisation d'impression. Cet événement peut apparaître dans les traces.
  fields:
    reservation_key:
      name: Réservation
      selector:
        text:

exporter_journal:
  name: Exporter le journal
  description: Retourne le chemin du CSV (le fichier est déjà à jour).

appliquer_tableau:
  name: Appliquer le tableau de bord
  description: Recrée le tableau locataire et la console propriétaire.

relire_calendrier:
  name: Relire le calendrier
  description: >
    Relance tout de suite un cycle Usvegliu (calendrier, vouchers, comptes HA).
    Sans attendre les 15 minutes. Administrateurs et utilisateurs avec droits.

reglages_sejour:
  name: Réglages d'un séjour
  description: >
    Remplace, pour une réservation, les entités ou appareils autorisés et
    l'accès internet. Les listes envoyées remplacent le réglage global.
    Le mot de passe n'est pas renvoyé ici.
  fields:
    reservation_key:
      name: Réservation
      description: Attribut reservation_id du capteur, ou UID du calendrier.
      required: true
      selector:
        text:
    entity_ids:
      name: Entités
      description: Tous domaines. Une caméra, serrure ou alarme exige la confirmation.
      selector:
        entity:
          multiple: true
    device_ids:
      name: Appareils
      description: Toutes les entités de ces appareils sont autorisées.
      selector:
        device:
          multiple: true
    allow_remote:
      name: Accès internet
      selector:
        select:
          options:
            - label: Réglage global
              value: inherit
            - label: Réseau local seulement
              value: local
            - label: Internet pendant ce séjour
              value: remote
    confirm_sensitive:
      name: Confirmer caméra, serrure ou alarme
      selector:
        boolean:
    reset:
      name: Revenir au réglage global
      selector:
        boolean:

lien_maison:
  name: Lien maison
  description: >
    Renvoie l'URL de la web app locataire pour un séjour, ou crée un lien
    d'essai de 24 h (sans calendrier) pour tester thermostats et Nuki.
  fields:
    reservation_key:
      name: Réservation
      description: Vide = séjour affiché par le capteur.
      selector:
        text:
    essai:
      name: Lien d'essai (24 h)
      description: Ignore le calendrier et ouvre un accès temporaire aux entités choisies.
      selector:
        boolean:
